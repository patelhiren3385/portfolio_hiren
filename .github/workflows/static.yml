name: Deploy static content to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/pcb-mount-app.yml
  deploy:
    needs: tests
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify published entry and studio assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          const base=process.env.PAGE_URL;
          const files=[['index.html','id="mount-studio-entry"'],['assets/apps/pcb-mount-optimizer/index.html','studio-core.js?v=3.0.0'],['assets/apps/pcb-mount-optimizer/studio.js',"version:'3.0.0'"]];
          for(const [path,expected] of files){
            let ok=false;
            for(let attempt=0;attempt<5;attempt++){
              const response=await fetch(new URL(path+'?check='+process.env.GITHUB_SHA,base));
              if(response.ok&&(await response.text()).includes(expected)){ok=true;break;}
              await new Promise(r=>setTimeout(r,5000));
            }
            if(!ok)throw new Error('Published content check failed: '+path);
            console.log('Published content OK: '+path);
          }
          JS
