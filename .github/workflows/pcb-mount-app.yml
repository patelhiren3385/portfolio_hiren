name: PCB mount app tests
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/apps/pcb-mount-optimizer/**'
      - 'assets/mount-showcase.js'
      - '.github/workflows/**'
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    # Keep the browser host OS compatible with the pinned Playwright release.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax, unit, integration and DOM contracts
        working-directory: assets/apps/pcb-mount-optimizer
        run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested browser tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real browser workflows and both navigation directions
        run: python assets/apps/pcb-mount-optimizer/v3-tests/browser_smoke.py
      - name: Browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mount-studio-browser-checks
          path: /tmp/mount-studio-*.png
          if-no-files-found: ignore
