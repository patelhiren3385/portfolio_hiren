<svg xmlns="http://www.w3.org/2000/svg" width="460" height="680" viewBox="0 0 460 680" role="img" aria-labelledby="title desc">
<title id="title">Thermo-mechanical analysis workflow</title>
<desc id="desc">Qualitative, exaggerated schematic: temperature, material expansion and mounts enter a structural solve, followed by strain and stress review. This is not a numerical result.</desc>
<defs><marker id="oa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#dc5a32" stroke-width="1.6"/></marker><style>text{font-family:Arial,sans-serif;fill:#263d2c}.stage{font-size:14px;letter-spacing:.6px;fill:#a45130}.body{font-size:17px;fill:#66755a}</style></defs>
<rect width="460" height="680" rx="4" fill="#f4f2eb"/>
<text x="22" y="31" font-size="13" letter-spacing=".6" fill="#738064">THERMO-MECHANICAL / HALT VANTAGE</text>
<text x="22" y="67" font-size="26" font-weight="600">Heat expands the assembly.</text>
<text x="22" y="98" font-size="26" font-weight="600">Mounts shape the response.</text>
<line x1="22" y1="117" x2="438" y2="117" stroke="#d5dccb"/>
<text x="22" y="145" class="stage">01 / INPUTS</text>
<rect x="22" y="159" width="416" height="91" rx="4" fill="#e5eadb" stroke="#d2dbc5"/>
<text x="38" y="187" font-size="19" font-weight="600">Temperature + materials + mounts</text>
<text x="38" y="214" class="body">Expansion properties, reference state,</text>
<text x="38" y="236" class="body">support locations and mechanical preload.</text>
<text x="22" y="279" class="stage">02 / STRUCTURAL SOLVE</text>
<path d="M66 358v43l10 4v-43M192 418v35l10 4v-35" fill="#aab99a" stroke="#6c805b" stroke-width="1.4"/>
<path d="M66 358 227 313 351 378 192 418Z" fill="#e5eadb" stroke="#849474" stroke-width="1.7" stroke-dasharray="6 4"/>
<path d="M66 358 240 304 376 374 192 418Z" fill="#e5ad7c" fill-opacity=".25" stroke="#dc5a32" stroke-width="2.3"/>
<path d="M127 338 269 398M181 322 322 386M108 380 282 325M149 401 330 350" fill="none" stroke="#d78e59" stroke-opacity=".55" stroke-width="1.1"/>
<circle cx="66" cy="358" r="6" fill="#f4f2eb" stroke="#36542c" stroke-width="2.5"/><circle cx="192" cy="418" r="6" fill="#f4f2eb" stroke="#36542c" stroke-width="2.5"/>
<path d="M351 378 402 364" fill="none" stroke="#dc5a32" stroke-width="2.2" marker-end="url(#oa)"/><path d="M227 313 251 292" fill="none" stroke="#dc5a32" stroke-width="2.2" marker-end="url(#oa)"/>
<text x="277" y="308" font-size="15" fill="#ab502f">Expansion</text>
<text x="40" y="434" font-size="15">Mount restraint</text>
<line x1="22" y1="474" x2="53" y2="474" stroke="#849474" stroke-width="1.8" stroke-dasharray="6 4"/><text x="62" y="480" font-size="14" fill="#758268">Reference</text>
<line x1="189" y1="474" x2="220" y2="474" stroke="#dc5a32" stroke-width="2.4"/><text x="229" y="480" font-size="14" fill="#758268">Illustrative expansion</text>
<text x="22" y="515" class="stage">03 / REVIEW</text>
<rect x="22" y="530" width="416" height="78" rx="4" fill="#1c3024"/>
<text x="39" y="558" font-size="21" font-weight="600" style="fill:#e0ead3">Strain, stress and distortion</text>
<text x="39" y="587" font-size="17" style="fill:#aec29b">Inspect the critical components and regions.</text>
<text x="22" y="635" font-size="13" font-weight="600" fill="#5b7447">STATIC + THERMO-MECHANICAL · END TO END</text>
<text x="22" y="658" font-size="13" fill="#748166">Workflow schematic · deformation exaggerated</text>
<text x="22" y="676" font-size="13" fill="#748166">No numerical result shown.</text>
