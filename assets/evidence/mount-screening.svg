<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="800" viewBox="0 0 1320 800" role="img" aria-labelledby="title desc">
  <title id="title">PCB mount screening: four mounts were sufficient in the sampled design study</title>
  <desc id="desc">Results from the submitted DMC2026 research digest. Four hundred layouts with two to six mounts were sampled. Fifteen passed a 1600 microstrain static screen under a 70 newton microcontroller-footprint load; five met the additional dynamic criteria. Four was the minimum sufficient count in the sampled DOE. Selected layout LAY_4_0072 uses mounts G006, G037, G047, G052, with 1499.2 microstrain and a first PCB-dominated mode at 823.6 hertz. Its static headroom is 100.8 microstrain and frequency headroom is 23.6 hertz. Alternative four-mount layout LAY_4_0004 reaches 1084.4 hertz but has only 3.5 microstrain of static headroom. No PCB-dominated stress peak was detected for the selected layout; this does not mean zero board stress. Tolerance robustness remains future work and the study does not establish a global optimum.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#dc5a32" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#202b27}.mono{font-family:monospace;letter-spacing:1px}.muted{fill:#586653}.orange{fill:#a6472c}.light{fill:#dce3d3}.line{stroke:#c9d2c1;fill:none}.on-dark{fill:#f4f2eb}.sub-dark{fill:#c0ceb0}</style>
  </defs>
  <rect width="1320" height="800" fill="#f4f2eb"/>
  <circle cx="63" cy="39" r="5" fill="#dc5a32"/>
  <text x="80" y="46" font-size="18" class="mono orange">PCB MOUNT LAYOUTS / A TRACEABLE DESIGN DECISION</text>
  <text x="60" y="98" font-size="42" font-weight="600" letter-spacing="-1.4">Four mounts. Selected by strain and dynamics.</text>
  <text x="60" y="130" font-size="22" class="muted">Two stages turn a broad design study into a defensible shortlist.</text>

  <path d="M60 151H1260" class="line"/>
  <text x="60" y="183" font-size="18" class="mono muted">SAMPLED DESIGNS</text>
  <text x="60" y="241" font-size="58" font-weight="600" letter-spacing="-2">400</text>
  <text x="190" y="221" font-size="20">2–6 active mounts</text>
  <text x="190" y="246" font-size="18" class="muted">Constrained, spatially diverse DOE</text>
  <path d="M445 217H495" fill="none" stroke="#dc5a32" stroke-width="2" marker-end="url(#a)"/>
  <text x="525" y="183" font-size="18" class="mono muted">STATIC PASSES</text>
  <text x="525" y="241" font-size="58" font-weight="600" letter-spacing="-2">15</text>
  <text x="608" y="221" font-size="20">3.75% retained</text>
  <text x="608" y="246" font-size="18" class="muted">All 15 proceed to dynamics</text>
  <path d="M864 217H914" fill="none" stroke="#dc5a32" stroke-width="2" marker-end="url(#a)"/>
  <text x="945" y="183" font-size="18" class="mono muted">FULLY FEASIBLE</text>
  <text x="945" y="241" font-size="58" font-weight="600" letter-spacing="-2" fill="#dc5a32">5</text>
  <text x="1002" y="221" font-size="20">2 with four mounts</text>
  <text x="1002" y="246" font-size="18" class="muted">3 with five mounts</text>
  <path d="M60 269H1260" class="line"/>
  <text x="60" y="299" font-size="19" class="muted">Static gate: 70 N; J<tspan baseline-shift="sub" font-size="18">L</tspan> ≤ 1,600 µε</text>
  <text x="545" y="299" font-size="19" class="muted">Dynamic gates: PCB peak contribution ≤ 5%; first PCB mode &gt; 800 Hz</text>

  <rect x="60" y="324" width="572" height="280" rx="5" fill="#202b27"/>
  <text x="83" y="356" font-size="18" class="mono sub-dark">SELECTED / MINIMUM SUFFICIENT COUNT: 4</text>
  <text x="83" y="397" font-size="33" font-weight="600" class="on-dark">LAY_4_0072</text>
  <text x="83" y="425" font-size="20" class="sub-dark">G006 · G037 · G047 · G052</text>
  <path d="M83 444H608" stroke="#687b5f" stroke-opacity=".55"/>
  <text x="83" y="479" font-size="18" class="sub-dark">Peak zone strain</text>
  <text x="354" y="479" font-size="18" class="sub-dark">First PCB mode</text>
  <text x="83" y="521" font-size="38" font-weight="600" class="on-dark">1,499.2<tspan font-size="22"> µε</tspan></text>
  <text x="354" y="521" font-size="38" font-weight="600" class="on-dark">823.6<tspan font-size="22"> Hz</tspan></text>
  <text x="83" y="551" font-size="19" class="sub-dark">100.8 µε headroom</text>
  <text x="354" y="551" font-size="19" class="sub-dark">23.6 Hz headroom</text>
  <circle cx="88" cy="581" r="4" fill="#b8cd9f"/>
  <text x="101" y="587" font-size="18" class="sub-dark">No PCB-dominated stress peak detected</text>

  <text x="668" y="353" font-size="23" font-weight="600">The four-mount tradeoff</text>
  <text x="668" y="384" font-size="19" class="muted">The alternative buys frequency margin with strain margin.</text>
  <path d="M668 402H1260" class="line"/>
  <text x="668" y="429" font-size="18" class="mono muted">LAYOUT</text>
  <text x="925" y="429" font-size="18" class="muted">Strain headroom</text>
  <text x="1120" y="429" font-size="18" class="muted">PCB frequency</text>
  <text x="668" y="468" font-size="22" font-weight="600">LAY_4_0072</text>
  <text x="925" y="468" font-size="22" font-weight="600">100.8 µε</text>
  <text x="1120" y="468" font-size="22" font-weight="600">823.6 Hz</text>
  <rect x="925" y="483" width="146" height="6" rx="3" fill="#dce3d3"/>
  <rect x="925" y="483" width="146" height="6" rx="3" fill="#849d71"/>
  <text x="668" y="526" font-size="22" font-weight="600">LAY_4_0004</text>
  <text x="925" y="526" font-size="22" font-weight="600" class="orange">3.5 µε</text>
  <text x="1120" y="526" font-size="22" font-weight="600">1,084.4 Hz</text>
  <rect x="925" y="541" width="146" height="6" rx="3" fill="#dce3d3"/>
  <rect x="925" y="541" width="5.07" height="6" rx="2" fill="#dc5a32"/>
  <text x="668" y="584" font-size="19" class="muted">Selected candidate: tolerance sensitivity still to be tested.</text>

  <rect x="60" y="625" width="1200" height="84" rx="4" fill="#e9e0d1"/>
  <text x="82" y="656" font-size="18" class="mono orange">POSITION MATTERS, EVEN AT THE SAME MOUNT COUNT</text>
  <text x="82" y="690" font-size="25" font-weight="600">1,499.2 vs 14,387.5 µε</text>
  <text x="434" y="690" font-size="20">≈ 9.6× difference · four mounts · same 70 N load</text>
  <text x="1035" y="656" font-size="18" class="muted">LAY_4_0072</text>
  <text x="1035" y="685" font-size="18" class="muted">vs LAY_4_0002</text>
  <text x="60" y="740" font-size="18" class="muted">DMC2026 research digest · submitted work · Figures 1–2 and numerical-results section</text>
  <text x="60" y="765" font-size="18" class="muted">Minimum sufficient count within the 400-layout sampled DOE; not a global optimum over all admissible layouts.</text>
  <text x="60" y="790" font-size="18" class="muted">“No detected peak” is a peak-based classification result; it does not mean zero PCB stress contribution.</text>
</svg>
