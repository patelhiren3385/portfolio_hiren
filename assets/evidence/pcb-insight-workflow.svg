<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820" role="img" aria-labelledby="title desc"><title id="title">pcb insight workflow</title><desc id="desc">Four stages of the implemented PCB analysis workflow, with completed static and thermo-mechanical analyses and an active random-vibration automation extension.</desc><rect width="1320" height="820" fill="#f4f2eb"/><g font-family="Arial, Helvetica, sans-serif"><text x="52" y="52" font-size="20" font-weight="600" fill="#dc5a32">ENGINEERING SOFTWARE / HALT VANTAGE</text><text x="52" y="110" font-size="42" font-weight="600" fill="#202b27">From files to a repeatable analysis.</text><text x="52" y="152" font-size="23" font-weight="400" fill="#606d61">A guided workflow around Sherlock exports and Ansys Mechanical.</text><rect x="52" y="198" width="276" height="238" rx="12" fill="#e3e8d9" stroke="none"/><text x="76" y="233" font-size="20" font-weight="600" fill="#dc5a32">01 / PREPARE</text><text x="76" y="279" font-size="28" font-weight="600" fill="#202b27">Import the model</text><text x="76" y="322" font-size="22" font-weight="400" fill="#606d61">Sherlock ZIP / CDB</text><text x="76" y="354" font-size="22" font-weight="400" fill="#606d61">Geometry and materials</text><text x="76" y="386" font-size="22" font-weight="400" fill="#606d61">Component selection</text><rect x="366" y="198" width="276" height="238" rx="12" fill="#e3e8d9" stroke="none"/><text x="390" y="233" font-size="20" font-weight="600" fill="#dc5a32">02 / DEFINE</text><text x="390" y="279" font-size="28" font-weight="600" fill="#202b27">Set the physics</text><text x="390" y="322" font-size="22" font-weight="400" fill="#606d61">Hole and face selectors</text><text x="390" y="354" font-size="22" font-weight="400" fill="#606d61">Grouped supports / loads</text><text x="390" y="386" font-size="22" font-weight="400" fill="#606d61">Saved boundary conditions</text><rect x="680" y="198" width="276" height="238" rx="12" fill="#e3e8d9" stroke="none"/><text x="704" y="233" font-size="20" font-weight="600" fill="#dc5a32">03 / SOLVE</text><text x="704" y="279" font-size="28" font-weight="600" fill="#202b27">Run the analysis</text><text x="704" y="322" font-size="22" font-weight="400" fill="#606d61">Static + thermal</text><text x="704" y="354" font-size="22" font-weight="400" fill="#606d61">Ansys Mechanical</text><text x="704" y="386" font-size="22" font-weight="400" fill="#606d61">Python-driven execution</text><rect x="994" y="198" width="274" height="238" rx="12" fill="#e3e8d9" stroke="none"/><text x="1018" y="233" font-size="20" font-weight="600" fill="#dc5a32">04 / REVIEW</text><text x="1018" y="279" font-size="28" font-weight="600" fill="#202b27">Inspect the result</text><text x="1018" y="322" font-size="22" font-weight="400" fill="#606d61">Strain / stress review</text><text x="1018" y="354" font-size="22" font-weight="400" fill="#606d61">Component-level context</text><text x="1018" y="386" font-size="22" font-weight="400" fill="#606d61">Prepared analysis files</text><path d="M334 312L358 312" fill="none" stroke="#606d61" stroke-width="3"/><path d="M349 305l9 7-9 7" fill="none" stroke="#606d61" stroke-width="3"/><path d="M648 312L672 312" fill="none" stroke="#606d61" stroke-width="3"/><path d="M663 305l9 7-9 7" fill="none" stroke="#606d61" stroke-width="3"/><path d="M962 312L986 312" fill="none" stroke="#606d61" stroke-width="3"/><path d="M977 305l9 7-9 7" fill="none" stroke="#606d61" stroke-width="3"/><rect x="52" y="472" width="1216" height="223" rx="12" fill="#202b27" stroke="none"/><text x="78" y="511" font-size="21" font-weight="600" fill="#c6d3b9">WHAT ALREADY WORKS</text><text x="78" y="554" font-size="31" font-weight="600" fill="#f4f2eb">Static analysis</text><text x="78" y="594" font-size="23" font-weight="400" fill="#d0d8c9">Import → setup → solve → review</text><text x="490" y="554" font-size="29" font-weight="600" fill="#f4f2eb">Thermo-mechanical analysis</text><text x="490" y="594" font-size="23" font-weight="400" fill="#d0d8c9">End-to-end workflow implemented</text><path d="M78 621L1240 621" fill="none" stroke="#516154" stroke-width="1"/><text x="78" y="660" font-size="20" font-weight="600" fill="#f3a07b">ACTIVE EXTENSION</text><text x="306" y="660" font-size="22" font-weight="400" fill="#f4f2eb">Random vibration: manual solve works; automated sequence in development.</text><text x="52" y="748" font-size="23" font-weight="600" fill="#202b27">CAPABILITY: solver automation + engineering UX + reusable analysis setup</text><text x="52" y="782" font-size="20" font-weight="400" fill="#606d61">Workflow reconstruction from project documentation; this is not a production-interface screenshot.</text></g></svg>