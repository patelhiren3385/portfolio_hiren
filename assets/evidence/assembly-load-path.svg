<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="840" viewBox="0 0 1320 840" role="img" aria-labelledby="title desc"><title id="title">assembly load path</title><desc id="desc">Diagram showing a total force of 400 newtons over the press tool, seven support pins, three final mounting regions and the boundary conditions still being investigated.</desc><rect width="1320" height="840" fill="#f4f2eb"/><g font-family="Arial, Helvetica, sans-serif"><text x="52" y="52" font-size="20" font-weight="600" fill="#dc5a32">ASSEMBLY MECHANICS / ONGOING ENGINEERING STUDY</text><text x="52" y="110" font-size="42" font-weight="600" fill="#202b27">Find the critical state before seating.</text><text x="52" y="152" font-size="23" font-weight="400" fill="#606d61">Model the transient load path while the board is carried by support pins.</text><rect x="52" y="196" width="754" height="394" rx="12" fill="#e8eadf" stroke="none"/><rect x="170" y="241" width="520" height="36" rx="4" fill="#c6c5b1" stroke="none"/><text x="324" y="228" font-size="20" font-weight="600" fill="#606d61">PRESS TOOL</text><path d="M230 285L230 326" fill="none" stroke="#dc5a32" stroke-width="4"/><path d="M222 318l8 10 8-10" fill="none" stroke="#dc5a32" stroke-width="3"/><path d="M350 285L350 326" fill="none" stroke="#dc5a32" stroke-width="4"/><path d="M342 318l8 10 8-10" fill="none" stroke="#dc5a32" stroke-width="3"/><path d="M470 285L470 326" fill="none" stroke="#dc5a32" stroke-width="4"/><path d="M462 318l8 10 8-10" fill="none" stroke="#dc5a32" stroke-width="3"/><path d="M590 285L590 326" fill="none" stroke="#dc5a32" stroke-width="4"/><path d="M582 318l8 10 8-10" fill="none" stroke="#dc5a32" stroke-width="3"/><text x="267" y="305" font-size="22" font-weight="400" fill="#202b27"></text><path d="M127 347Q428 400 731 347L731 362Q428 415 127 362Z" fill="#6d8262" stroke="#425b40" stroke-width="2"/><rect x="178" y="371.1" width="13" height="136.9" rx="2" fill="#a3a99b" stroke="none"/><rect x="253" y="380.2" width="13" height="127.8" rx="2" fill="#a3a99b" stroke="none"/><rect x="328" y="385.9" width="13" height="122.1" rx="2" fill="#a3a99b" stroke="none"/><rect x="403" y="388.4" width="13" height="119.6" rx="2" fill="#a3a99b" stroke="none"/><rect x="478" y="387.6" width="13" height="120.4" rx="2" fill="#a3a99b" stroke="none"/><rect x="553" y="383.6" width="13" height="124.4" rx="2" fill="#a3a99b" stroke="none"/><rect x="628" y="376.2" width="13" height="131.8" rx="2" fill="#a3a99b" stroke="none"/><rect x="142" y="508" width="560" height="18" rx="3" fill="#9ba48f" stroke="none"/><text x="210" y="558" font-size="22" font-weight="400" fill="#606d61">7 support pins · schematic, not to scale</text><text x="845" y="232" font-size="58" font-weight="600" fill="#dc5a32">400 N</text><text x="845" y="270" font-size="24" font-weight="600" fill="#202b27">TOTAL applied force</text><text x="845" y="309" font-size="21" font-weight="400" fill="#606d61">Distributed over tool-contact regions.</text><path d="M845 337L1268 337" fill="none" stroke="#c9cec1" stroke-width="1"/><text x="845" y="377" font-size="40" font-weight="600" fill="#202b27">4 mm</text><text x="845" y="412" font-size="22" font-weight="400" fill="#606d61">initial gap in the study setup</text><text x="845" y="460" font-size="27" font-weight="600" fill="#202b27">3 mounting regions</text><text x="845" y="495" font-size="22" font-weight="400" fill="#606d61">before final engagement</text><text x="845" y="547" font-size="21" font-weight="600" fill="#dc5a32">OUTPUT: board strain assessment</text><rect x="52" y="624" width="1216" height="93" rx="12" fill="#202b27" stroke="none"/><text x="78" y="661" font-size="21" font-weight="600" fill="#f3a07b">ENGINEERING CHECK</text><text x="335" y="659" font-size="23" font-weight="400" fill="#f4f2eb">Compare support idealisations; refine with contact sequence,</text><text x="335" y="692" font-size="23" font-weight="400" fill="#f4f2eb">support stiffness and measured force–displacement behaviour.</text><text x="52" y="766" font-size="23" font-weight="600" fill="#202b27">Candidate critical state; not yet demonstrated to bound the real peak strain.</text><text x="52" y="803" font-size="20" font-weight="400" fill="#606d61">Reconstructed study setup. Distinct from the 70 N load case in the mount-layout research.</text></g></svg>