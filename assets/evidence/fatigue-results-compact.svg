<g font-family="Arial, Helvetica, sans-serif" fill="#202b27">
<text x="24" y="36" font-size="23" font-weight="600">How close is the life prediction?</text>
<text x="24" y="61" font-size="14" fill="#616d60">Dirlik method · measured damping · all six comparisons</text>
