<circle cx="205.429" cy="212" r="5.5" fill="#304c3c"/>
<text x="215.429" y="217" font-size="15" font-weight="600" fill="#304c3c">0.57×</text>
<line x1="229.000" y1="236" x2="196.168" y2="236" stroke="#dc5a32" stroke-width="2" opacity="0.35"/>
<path d="M196.168 229.5 202.668 236 196.168 242.5 189.668 236Z" fill="#dc5a32"/>
<text x="206.168" y="241" font-size="15" font-weight="600" fill="#dc5a32">0.40×</text>
