<line x1="229.000" y1="172" x2="256.500" y2="172" stroke="#dc5a32" stroke-width="2" opacity="0.35"/>
<path d="M256.500 165.5 263.000 172 256.500 178.5 250.000 172Z" fill="#dc5a32"/>
