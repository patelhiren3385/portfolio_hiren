<svg xmlns="http://www.w3.org/2000/svg" width="650" height="400" viewBox="0 0 650 400" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Dirlik fatigue predictions compared with measured mean life</title>
<desc id="chart-description">All six calibrated Dirlik comparisons from the published paper. Ratios are predicted life divided by measured mean life. For X–0.20 VDR3, the measured mean was 9.0 minutes and M1_C and M3_C ratios are 1.34 and 1.50. For X–0.20 C14, the measured mean was 19.6 minutes and the ratios are 0.57 and 0.40. For Y–0.05 VDR3, the measured mean was 34.6 minutes and the ratios are 4.56 and 7.27. A vertical line at one marks exact agreement. The shaded 0.5 to 2 range is a visual reference only, not an acceptance criterion. Ratios are recomputed from the reported lifetimes in Tables 2.1 and 5.3.</desc>
