<text x="45" y="98" font-size="15">M1_C · solid PCB</text>
<path d="M238 86.5 244.5 93 238 99.5 231.5 93Z" fill="#dc5a32"/>
<text x="252" y="98" font-size="15">M3_C · shell PCB</text>
<rect x="201.500" y="126" width="82.500" height="189" fill="#dfe6d6"/>
