<line x1="504.000" y1="126" x2="504.000" y2="315" stroke="#d9dcd1"/>
<line x1="614.000" y1="126" x2="614.000" y2="315" stroke="#d9dcd1"/>
<line x1="229.000" y1="121" x2="229.000" y2="320" stroke="#57634e" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="24" y="152" font-size="15" font-weight="600">X–0.20 / VDR3</text>
<text x="24" y="174" font-size="14" fill="#616d60">Test: 9.0 min</text>
