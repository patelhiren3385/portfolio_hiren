<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820" role="img" aria-labelledby="title desc"><title id="title">geometry enrichment</title><desc id="desc">Input data, implemented body and lead enrichment, and explicit boundaries of the geometry matching work.</desc><rect width="1320" height="820" fill="#f4f2eb"/><g font-family="Arial, Helvetica, sans-serif"><text x="52" y="52" font-size="20" font-weight="600" fill="#dc5a32">GEOMETRY AUTOMATION / COMPONENT ENRICHMENT</text><text x="52" y="110" font-size="42" font-weight="600" fill="#202b27">Give the solver the missing detail.</text><text x="52" y="152" font-size="23" font-weight="400" fill="#606d61">Connect part identity, position and shape before trusting the structural model.</text><rect x="52" y="200" width="320" height="245" rx="12" fill="#e3e8d9" stroke="none"/><text x="76" y="235" font-size="20" font-weight="600" fill="#dc5a32">INPUTS</text><text x="76" y="281" font-size="28" font-weight="600" fill="#202b27">Source evidence</text><text x="76" y="324" font-size="22" font-weight="400" fill="#606d61">Part list → identity</text><text x="76" y="356" font-size="22" font-weight="400" fill="#606d61">STEP → body geometry</text><text x="76" y="388" font-size="22" font-weight="400" fill="#606d61">PCB / ODB++ → placement</text><rect x="415" y="200" width="405" height="245" rx="12" fill="#e3e8d9" stroke="none"/><text x="439" y="235" font-size="20" font-weight="600" fill="#dc5a32">MATCH + ENRICH</text><text x="439" y="281" font-size="28" font-weight="600" fill="#202b27">Make the model consistent</text><text x="439" y="324" font-size="22" font-weight="400" fill="#606d61">Match location and dimensions</text><text x="439" y="356" font-size="22" font-weight="400" fill="#606d61">Resolve body orientation</text><text x="439" y="388" font-size="22" font-weight="400" fill="#606d61">Add lead / pad information</text><rect x="863" y="200" width="405" height="245" rx="12" fill="#e3e8d9" stroke="none"/><text x="887" y="235" font-size="20" font-weight="600" fill="#dc5a32">OUTPUT</text><text x="887" y="281" font-size="28" font-weight="600" fill="#202b27">Reviewable models</text><text x="887" y="324" font-size="22" font-weight="400" fill="#606d61">Improved body descriptions</text><text x="887" y="356" font-size="22" font-weight="400" fill="#606d61">SMT lead representations</text><text x="887" y="388" font-size="22" font-weight="400" fill="#606d61">Ambiguous matches flagged</text><path d="M380 320L405 320" fill="none" stroke="#606d61" stroke-width="3"/><path d="M396 313l9 7-9 7" fill="none" stroke="#606d61" stroke-width="3"/><path d="M829 320L854 320" fill="none" stroke="#606d61" stroke-width="3"/><path d="M845 313l9 7-9 7" fill="none" stroke="#606d61" stroke-width="3"/><rect x="52" y="487" width="750" height="199" rx="12" fill="#e3e8d9" stroke="none"/><text x="80" y="532" font-size="21" font-weight="600" fill="#dc5a32">IMPLEMENTED CAPABILITY</text><text x="80" y="576" font-size="29" font-weight="600" fill="#202b27">Body matching, orientation and SMT leads</text><text x="80" y="620" font-size="24" font-weight="400" fill="#606d61">Use geometry and placement evidence together.</text><text x="80" y="653" font-size="23" font-weight="400" fill="#606d61">Keep uncertain matches visible for engineering review.</text><rect x="826" y="487" width="442" height="199" rx="12" fill="#202b27" stroke="none"/><text x="854" y="532" font-size="21" font-weight="600" fill="#f2a07e">ACTIVE DEVELOPMENT</text><text x="854" y="575" font-size="24" font-weight="400" fill="#f4f2eb">Through-hole lead reconstruction</text><text x="854" y="615" font-size="22" font-weight="400" fill="#f4f2eb">Unusual bodies and ambiguous rotations</text><text x="854" y="652" font-size="24" font-weight="400" fill="#f4f2eb">General matching reliability</text><text x="52" y="747" font-size="23" font-weight="600" fill="#202b27">CAPABILITY: data integration + geometry reasoning + explicit quality control</text><text x="52" y="782" font-size="20" font-weight="400" fill="#606d61">Engineering-workflow reconstruction; no match-rate or fatigue improvement is claimed.</text></g></svg>