<text x="859" y="141" class="stage">03 / REVIEW THE RESPONSE</text>
<rect x="859" y="164" width="311" height="272" rx="4" fill="#1c3024"/>
<text x="883" y="203" font-size="22" font-weight="600" style="fill:#e0ead3">Strain &amp; stress</text>
<text x="883" y="234" font-size="17" style="fill:#a9be95">Locate the critical regions.</text>
<line x1="883" y1="258" x2="1146" y2="258" stroke="#688552" stroke-opacity=".5"/>
<path d="m886 285 5 5 9-10M886 326l5 5 9-10M886 367l5 5 9-10" fill="none" stroke="#a1c47e" stroke-width="2"/>
<text x="913" y="290" font-size="17" style="fill:#cfddc0">Displacement &amp; distortion</text>
<text x="913" y="331" font-size="17" style="fill:#cfddc0">Local strain and stress</text>
<text x="913" y="372" font-size="17" style="fill:#cfddc0">Component / region review</text>
<text x="883" y="413" font-size="13" style="fill:#9bb186">Interpret the response after the solve.</text>

<text x="30" y="475" font-size="17" fill="#5f7053">Temperature is applied or transferred; the structural solve computes constrained expansion.</text>
<line x1="30" y1="496" x2="1170" y2="496" stroke="#d5dccb"/>
<text x="30" y="528" font-size="14" fill="#748166">Workflow schematic · deformation exaggerated · no numerical result shown.</text>
<rect x="827" y="510" width="343" height="29" rx="14" fill="#e0e7d4"/>
<text x="998.5" y="529" text-anchor="middle" font-size="12" font-weight="600" letter-spacing=".3">STATIC + THERMO-MECHANICAL · END TO END</text>
</svg>