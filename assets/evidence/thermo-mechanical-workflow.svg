<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Thermo-mechanical workflow: temperature, constrained expansion, strain and stress</title>
<desc id="desc">A qualitative workflow schematic. Prescribed or transferred temperature, material expansion properties and reference temperature, and mounts and preload enter a structural solve. A reference plate outline and exaggerated expanded shape illustrate restrained motion at two schematic supports. Review displacement, strain and local stress. This depicts a workflow, not a numerical result or a particular paper's solved geometry.</desc>
<defs>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 7 4.5 1 8" fill="none" stroke="#728060" stroke-width="1.5"/></marker>
 <marker id="orangeArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#dc5a32" stroke-width="1.6"/></marker>
 <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M-1 7 7-1M6 8 8 6" stroke="#b5bea7" stroke-width="1"/></pattern>
 <style>text{font-family:Arial,sans-serif;fill:#263d2c}.small{font-size:14px;letter-spacing:1px;fill:#748166}.label{font-size:18px;font-weight:600}.body{font-size:17px;fill:#68765d}.fine{font-size:14px;fill:#758268}.stage{font-size:14px;letter-spacing:1.1px;fill:#a45130}</style>
</defs>
<rect width="1200" height="560" rx="5" fill="#f4f2eb"/>
<text x="30" y="37" class="small">THERMO-MECHANICAL ANALYSIS / HALT VANTAGE</text>
<text x="30" y="78" font-size="29" font-weight="600" letter-spacing="-.5">Temperature → constrained expansion → strain &amp; stress</text>
<line x1="30" y1="102" x2="1170" y2="102" stroke="#d5dccb"/>

<text x="30" y="141" class="stage">01 / DEFINE THE INPUTS</text>
<rect x="30" y="164" width="278" height="82" rx="4" fill="#e5eadb" stroke="#d2dbc5"/>
<path d="M49 198q10-13 20 0t20 0" fill="none" stroke="#dc5a32" stroke-width="2"/>
<text x="104" y="195" class="label">Temperature</text>
<text x="49" y="227" class="body">Prescribed or transferred</text>
<rect x="30" y="259" width="278" height="82" rx="4" fill="#e5eadb" stroke="#d2dbc5"/>
<text x="49" y="289" class="label">Material expansion</text>
<text x="49" y="321" class="body">Properties + reference state</text>
<rect x="30" y="354" width="278" height="82" rx="4" fill="#e5eadb" stroke="#d2dbc5"/>
<text x="49" y="385" class="label">Mounts &amp; preload</text>
<text x="49" y="416" class="body">Support and loading intent</text>
<path d="M325 300H353" fill="none" stroke="#728060" stroke-width="2" marker-end="url(#arrow)"/>

<text x="378" y="141" class="stage">02 / STRUCTURAL SOLVE</text>
<text x="378" y="179" font-size="23" font-weight="600">How can the assembly move?</text>
<!-- Fixed fixture points and an illustrative plate; neither shape is solver output. -->
<path d="M402 273v53l11 5v-54M538 345v47l11 5v-48" fill="#aab99a" stroke="#6c805b" stroke-width="1.4"/>
<path d="m386 326 31 5 15-5-31-5Z M522 392l31 5 15-5-31-5Z" fill="url(#hatch)" stroke="#98aa83"/>
<path d="M402 273 572 226 708 298 538 345Z" fill="#e6ebdd" fill-opacity=".6" stroke="#849474" stroke-width="1.8" stroke-dasharray="6 5"/>
<path d="M402 273 586 217 735 294 538 345Z" fill="#e5ad7c" fill-opacity=".25" stroke="#dc5a32" stroke-width="2.4"/>
<path d="M467 253 621 323M522 236 682 310" stroke="#d78e59" stroke-opacity=".55" stroke-width="1.1"/>
<path d="M445 298 634 243M491 321 685 270" stroke="#d78e59" stroke-opacity=".55" stroke-width="1.1"/>
<circle cx="402" cy="273" r="6.5" fill="#f4f2eb" stroke="#36542c" stroke-width="2.5"/>
<circle cx="538" cy="345" r="6.5" fill="#f4f2eb" stroke="#36542c" stroke-width="2.5"/>
<path d="M709 299 760 285" fill="none" stroke="#dc5a32" stroke-width="2.4" marker-end="url(#orangeArrow)"/>
<path d="M571 226 597 204" fill="none" stroke="#dc5a32" stroke-width="2.2" marker-end="url(#orangeArrow)"/>
<text x="617" y="201" font-size="16" fill="#ab502f">Expansion</text>
<path d="M407 332 428 354" fill="none" stroke="#7b8b69" stroke-width="1.2"/>
<text x="379" y="379" font-size="16">Mount restraint</text>
<line x1="378" y1="423" x2="410" y2="423" stroke="#849474" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="419" y="428" class="fine">Reference</text>
<line x1="542" y1="423" x2="574" y2="423" stroke="#dc5a32" stroke-width="2.4"/>
