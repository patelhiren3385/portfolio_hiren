<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Caterpillar: engineering models and a condition-monitoring application delivered to production</title>
  <desc id="desc">Hiren Patel, Senior Associate Engineer at Caterpillar R&amp;D, 2021 to 2024. The principal documented application used a convolutional neural network to grade journal-bearing wear on a one-to-ten output scale. Hiren owned it from ideation to production deployment and mentored one intern. Separate workstreams covered powertrain and driveline reduced-order models for bearing performance and durability, vibration and acoustic DNN gear-fault diagnostics, and machine-learning damper acceptability. Python GUIs and Django web tools are shown as a separate engineering-software capability. All diagrams are explanatory; no proprietary input, assessment grade, accuracy or production architecture is depicted.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#dc5a32" stroke-width="1.5"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#202b27}
      .mono{font-family:monospace;letter-spacing:1px}
      .muted{fill:#5d6a58}.orange{fill:#b84627}.light{fill:#f4f2eb}.sage{fill:#c9d2bd}
      .outline{fill:none;stroke:#202b27;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .flow{fill:none;stroke:#dc5a32;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
